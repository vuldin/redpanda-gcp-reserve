name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck redpanda-gcp-reserve.sh tests/run.sh tests/stubs/*

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]   # macOS runs the tests under bash 3.2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash --version | head -1
      - run: tests/run.sh
